<!doctype html>

<body>
  <div class="page">
    <header class="brand-row">
      <a class="brand" href="./" aria-label="DappNav 首页"><img src="public/logo.png" alt="DappNav" width="60" height="60"><span class="brand-name">Dapp<span class="brand-accent">Nav</span></span></a>
